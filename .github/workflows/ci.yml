name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  mysql:
    name: API — MySQL 8.4 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: restaurant-root
          MYSQL_DATABASE: restaurant
          MYSQL_USER: restaurant
          MYSQL_PASSWORD: restaurant
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prestaurant-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI_REQUIRE_MYSQL: "1"
      DATABASE_URL: mysql+asyncmy://restaurant:restaurant@127.0.0.1:3306/restaurant_integration?charset=utf8mb4
      MYSQL_TEST_DATABASE_URL: mysql+asyncmy://restaurant:restaurant@127.0.0.1:3306/restaurant_test?charset=utf8mb4
      AI_READONLY_URL_MANAGER: mysql+asyncmy://ci_ai_manager:ci-manager-pass@127.0.0.1:3306/restaurant_integration
      AI_READONLY_URL_CASHIER: mysql+asyncmy://ci_ai_cashier:ci-cashier-pass@127.0.0.1:3306/restaurant_integration
      AI_READONLY_URL_WAREHOUSE: mysql+asyncmy://ci_ai_warehouse:ci-warehouse-pass@127.0.0.1:3306/restaurant_integration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
        working-directory: apps/api
      - run: bash scripts/prepare_ci_mysql.sh
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_ROOT_PASSWORD: restaurant-root
      - run: uv run pytest -m integration --junitxml=mysql-results.xml
        working-directory: apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-integration-results
          path: apps/api/mysql-results.xml

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The package manager is pinned in the web package, not at the repo root.
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
