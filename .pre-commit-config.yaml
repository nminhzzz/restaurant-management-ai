# Fast local checks that mirror part of `make gate`. Enable once per clone with:
#   pipx install pre-commit && pre-commit install
# The full gate (lint · typecheck · test · build) still runs in CI and via `make gate`.
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: local
    hooks:
      - id: prettier-web
        name: prettier (apps/web)
        entry: bash -c 'cd apps/web && pnpm exec prettier --write .'
        language: system
        files: ^apps/web/
        pass_filenames: false
