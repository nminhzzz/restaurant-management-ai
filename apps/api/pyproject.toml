[project]
name = "restaurant-api"
version = "0.1.0"
description = "Backend API for the AI-powered restaurant management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlglot>=26.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
