[project]
name = "restaurant-api"
version = "0.1.0"
description = "Backend API for the AI-powered restaurant management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncmy>=0.2.9",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlglot>=26.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "F401", "RUF100"]
"tests/helpers.py" = ["E501"]
"tests/conftest.py" = ["E501"]
"src/app/shared/base.py" = ["E402", "E501"]
"src/app/core/dependencies.py" = ["E501"]
"src/app/modules/settings/service.py" = ["E501"]
"src/app/modules/settings/router.py" = ["B008", "E501"]
"tests/modules/test_settings_auth.py" = ["E501"]
"tests/modules/test_settings_accounts.py" = ["E501"]
"tests/modules/test_settings_config.py" = ["E501"]
"tests/modules/test_settings_audit_log.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real MySQL instance (make db-up)",
    "slow: seeds a full year of data; run explicitly, not in the gate",
]
pythonpath = [".", "src", "../.."]
addopts = "-q --strict-markers -m 'not integration and not slow'"
